# Builds and tests CEINMS on Linux, using the same image the Bitbucket pipeline used
# so the dependencies (OpenSim, XSD/Xerces, Filter, Concurrency) come preinstalled.
name: Build and Test

on:
  push:
    branches: [main]
    tags: ['*']
  pull_request:
    branches: [main]

jobs:
  build:
    name: Linux (RelWithDebInfo)
    runs-on: ubuntu-latest
    container: matthewhambly/ceinms-environment:latest

    steps:
      - uses: actions/checkout@v4

      # Report the toolchain first: when a build fails inside a prebuilt image it is
      # usually the image that moved, and this is the cheapest way to see that.
      - name: Toolchain versions
        run: cmake --version && c++ --version

      # Deliberately the same commands the Bitbucket pipeline used, rather than the
      # newer cmake -B / ctest --test-dir spellings, which need CMake 3.13 and 3.20
      # respectively and would silently tie CI to a newer CMake than the image has.
      - name: Configure
        run: |
          mkdir build
          cd build
          cmake -DCMAKE_BUILD_TYPE=RelWithDebInfo ..

      - name: Build
        working-directory: build
        run: make -j2

      - name: Test
        working-directory: build
        run: ctest --output-on-failure
